[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-virtue-eval"
version = "0.2.0"
description = "Inspect AI benchmark for epistemic virtues, with a web console and a Constitutional Guardian"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.100",
    "PyYAML>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]
google = ["google-genai"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
eve-web = "epistemic_virtue.web.app:main"
eve-run = "epistemic_virtue.cli:main"

[tool.setuptools.packages.find]
include = ["epistemic_virtue*"]

[tool.setuptools.package-data]
epistemic_virtue = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
